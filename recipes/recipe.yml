# image will be published to ghcr.io/<user>/<name>
name: tkkos
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/aurora
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: script
    snippets:
      - "wget --tries=10 https://raw.githubusercontent.com/ivan-hc/AM/main/APP-MANAGER -O /usr/local/bin/appman && chmod a+x /usr/local/bin/appman"
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /
                       # put configuration files you want in /usr/etc/ inside the image
                       # while putting files in /etc/ is done on booted system by system administrators.
                       # read more about this in files module reference.

  - type: rpm-ostree
    repos:
      - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      - https://repository.mullvad.net/rpm/stable/mullvad.repo
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-44.noarch.rpm
      - https://copr.fedorainfracloud.org/coprs/deltacopy/darkly/repo/fedora-44/deltacopy-darkly-fedora-44.repo
    install:
        # CLI Tools:
        - zsh
        - adb
        - trash-cli
        - btop
        - zoxide

        # Networking
        - tailscale

        # Development
        - vim
        - neovim
        - git
        - distrobox
        - docker
        - podman

        # Looks
        - darkly

        # Drivers
        - kernel-modules-extra

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          title: Flathub (User)
        install:
          - app.zen_browser.zen
          - com.borgbase.Vorta
          - net.lutris.Lutris
          - org.libreoffice.LibreOffice
          - com.obsproject.Studio
          - org.prismlauncher.PrismLauncher
      - notify: true
        scope: system
        repo:
          title: Flathub (system)
        install:
          - org.libreoffice.LibreOffice
          - org.kde.gwenview

  - type: systemd
    system:
      enabled:
        - tailscaled

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
